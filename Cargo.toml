[package]
name = "stockwise"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Autonomous stock market CLI — quotes, analysis, backtesting, SIP, intraday signals, tax, and wealth tracking across US and Indian markets."
documentation = "https://github.com/iamsaquib8/stockwise/tree/master/docs"
homepage = "https://github.com/iamsaquib8/stockwise"
repository = "https://github.com/iamsaquib8/stockwise"
readme = "README.md"
license = "MIT"
keywords = ["stocks", "trading", "finance", "cli", "stock-market"]
categories = ["command-line-utilities", "finance"]
exclude = ["assets/", "docs/", ".github/", "*.tape", "install.sh"]

# `cargo binstall stockwise` downloads the prebuilt release binary instead of
# compiling. Asset names must match .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "3"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
redis = { version = "0.27", features = ["tokio-comp"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
opt-level = 3
lto = true
