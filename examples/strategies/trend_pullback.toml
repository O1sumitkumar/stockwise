# Example: buy dips in an uptrend, with a stop and a target.
# Copy to the `strategies/` folder next to your config file (`stockwise backtest strategies`
# prints it) and run `stockwise backtest TCS -s trend_pullback`,
# or run it in place with `-s file:examples/strategies/trend_pullback.toml`.
name = "trend_pullback"
description = "Above the 200-day average, buy RSI dips; 8% stop, 15% target"
entry = ["close > sma(200)", "rsi(14) < $dip"]
exit = "rsi(14) > 70 or close < sma(200)"
stop_loss_pct = 8
take_profit_pct = 15

[params]
dip = 35

[grid]
dip = [30, 35, 40]
