# A StockWise strategy plugin: RSI mean reversion compiled to WebAssembly.
# Its own Cargo project, not part of the stockwise build. Build with
#   cargo build --target wasm32-unknown-unknown --release
[package]
name = "wasm-strategy-rsi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Not a member of any parent workspace.
[workspace]
