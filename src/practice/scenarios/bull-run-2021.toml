description = """
January 2021. Indian stocks have recovered from the 2020 crash, vaccines are \
on the way and record numbers of new investors are opening demat accounts. \
You have ₹1,00,000 of paper money and eighteen NIFTY 50 stocks to choose from."""
debrief = """
NIFTY 50 rose about 30% from January to its October 2021 peak near 18,500, \
with a choppy spell during the second COVID wave in April and May. Metals, IT \
and some financials led. In a strong market the hard part is staying invested \
and letting winners run while still cutting losers."""

