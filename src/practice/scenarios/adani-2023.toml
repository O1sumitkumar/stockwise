On 24 January 2023 a US short seller published a report accusing the Adani group \
of stock manipulation and accounting fraud, which the group denied. Adani shares \
lost well over $100 billion of market value within weeks, and Adani Enterprises \
called off its fully subscribed share sale on 1 February. NIFTY 50 moved far less. \
Concentration in one group is a risk that diversification exists to limit."""

