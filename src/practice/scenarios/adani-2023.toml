description = """
January 2023. The Adani group's listed companies have been among the best \
performers of the last three years, and Adani Enterprises is about to launch a \
large follow-on share sale. You have ₹1,00,000 of paper money, six Adani \
companies and ten NIFTY 50 heavyweights to choose from."""
